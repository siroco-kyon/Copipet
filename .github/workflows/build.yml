name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build Copipet.sln -c Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src/Copipet/bin/Release/net48/Copipet.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath Copipet.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Copipet
          path: dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} Copipet.zip --title "コピペット ${{ github.ref_name }}" --generate-notes
